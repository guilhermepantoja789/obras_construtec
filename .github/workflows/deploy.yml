name: Deploy to Server

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, zip
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependências do Composer
      run: composer install --no-dev --prefer-dist --optimize-autoloader --ignore-platform-reqs


    - name: Instalar dependências do NPM e gerar Build
      run: |
        npm install
        npm run build



    # 1. Compacta o código (ignora as pastas desnecessárias)
    - name: Criar arquivo ZIP
      run: |
        zip -r deploy.zip . -x "node_modules/*" -x ".git/*" -x ".env" -x ".DS_Store" -x "bootstrap/cache/*" -x "tests/*" -x "storage/logs/*" -x "phpunit.xml"

    # 2. Envia o ZIP usando sshpass e scp nativo para suportar o HostGator
    - name: Copiar arquivos via SCP
      env:
        SSHPASS: ${{ secrets.SERVER_PASSWORD }}
      run: |
        sudo apt-get update && sudo apt-get install -y sshpass
        sshpass -e scp -o StrictHostKeyChecking=no -o KexAlgorithms=+diffie-hellman-group-exchange-sha256 deploy.zip ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:diario_obras_core/

    # 3. Executa os comandos no servidor usando ssh nativo
    - name: Executar script de Deploy via SSH
      env:
        SSHPASS: ${{ secrets.SERVER_PASSWORD }}
      run: |
        sshpass -e ssh -o StrictHostKeyChecking=no -o KexAlgorithms=+diffie-hellman-group-exchange-sha256 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          cd diario_obras_core/
          rm -rf public/build/
          unzip -o deploy.zip
          rm deploy.zip
          rm -f bootstrap/cache/*.php
          rm -f bootstrap/cache/routes-*.php
          php artisan optimize:clear

          php artisan config:cache
          php artisan event:cache
          php artisan route:clear
          php artisan view:cache
          php artisan migrate --force
          rm -rf public/storage
          cd public && ln -s ../storage/app/public storage && cd ..
          mkdir -p ~/public_html/construtec/
          ln -snf ~/diario_obras_core/public/ ~/public_html/construtec/diario_obras/
          if [ -f ~/public_html/.htaccess ] && ! grep -q "construtec/diario_obras" ~/public_html/.htaccess; then
            echo "WARNING: ~/public_html/.htaccess sem regra de exceção para construtec/diario_obras"
            echo "Adicione regra para não redirecionar esse path para g2mhome/public."
          fi
        EOF
